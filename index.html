<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:css='false' b:defaultwidgetversion='2' b:layoutsversion='3' lang='en' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/gah/b/widget' xmlns:data='http://www.google.com/gah/b/text' xmlns:expr='http://www.google.com/gah/b/expr'>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qaim's Coder | Advanced Build Studio</title>
    
    <b:skin><![CDATA[
        /* Blogger Required Skin Section */
    ]]></b:skin>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        /*<![CDATA[*/
        :root {
            --bg-base: #09090b;
            --bg-panel: #141417;
            --bg-input: #1e1e24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        .sidebar { width: 320px; min-width: 320px; display: flex; flex-direction: column; background: var(--bg-panel); border-right: 1px solid var(--border-color); z-index: 10; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-base); position: relative; }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 20px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text { font-weight: 700; font-size: 1rem; letter-spacing: -0.5px; }

        .sidebar-content { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
        
        .btn-new {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-new:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-primary); }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        
        .form-control {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            outline: none;
        }
        .form-control:focus { border-color: var(--accent-primary); }
        textarea.form-control { resize: none; min-height: 120px; line-height: 1.5; }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-stop { background: var(--danger); display: none; }

        .history-section { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-color); }
        .history-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; }
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .history-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
            border: 1px solid transparent;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-main); }
        .history-item.active { border-color: var(--accent-primary); color: var(--text-main); background: rgba(99, 102, 241, 0.1); }

        .panel-header {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn:hover { background: var(--bg-input); color: var(--text-main); }

        .editor-workspace { flex: 1; display: flex; overflow: hidden; position: relative; }
        .line-numbers { width: 45px; padding: 16px 0; background: var(--bg-panel); border-right: 1px solid var(--border-color); text-align: right; font-family: var(--font-code); font-size: 13px; color: #52525b; }
        .line-numbers span { display: block; padding-right: 12px; }

        .code-container { flex: 1; position: relative; overflow: auto; }
        #code-input, #code-output {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 16px; font-family: var(--font-code); font-size: 13px; line-height: 1.6;
            white-space: pre; border: none; outline: none;
        }
        #code-input { z-index: 2; color: transparent; background: transparent; caret-color: var(--accent-primary); resize: none; }
        #code-output-wrapper { position: absolute; z-index: 1; pointer-events: none; width: 100%; height: 100%; }

        .preview-overlay-container { position: absolute; inset: 0; background: #fff; z-index: 100; display: none; flex-direction: column; }
        .preview-overlay-container.visible { display: flex; }
        .preview-header { height: 50px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: #475569; }
        iframe { width: 100%; height: 100%; border: none; }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-panel); color: var(--text-main); padding: 12px 20px; border-radius: 8px; border-left: 4px solid var(--accent-primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        /*]]>*/
    </style>
</head>
<body>
    <b:section id='main' showaddelement='no'>
        <b:widget id='Blog1' locked='true' title='Blog Posts' type='Blog' visible='false'/>
    </b:section>

    <div id="toast-container" class="toast-container"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container"><i class="fa-solid fa-code-branch logo-icon"></i><span class="logo-text">Qaim's Coder</span></div>
            <div id="status-dot" style="width:8px; height:8px; border-radius:50%; background:var(--text-muted);"></div>
        </div>
        
        <div class="sidebar-content">
            <button id="btn-new" class="btn-new"><i class="fa-solid fa-plus"></i> New Project</button>
            
            <div class="input-group">
                <label id="prompt-label">Describe or Edit</label>
                <textarea id="website-description" class="form-control" placeholder="What should I build or change?"></textarea>
                <button id="btn-generate" class="btn-primary"><i class="fa-solid fa-bolt"></i> <span id="btn-text">Build Site</span></button>
                <button id="btn-stop" class="btn-primary btn-stop"><i class="fa-solid fa-stop"></i> Stop</button>
            </div>

            <div class="history-section">
                <div class="history-title">Session History</div>
                <div id="history-list" class="history-list">
                    <!-- History items injected here -->
                </div>
            </div>
        </div>
    </aside>

    <main class="editor-panel">
        <div class="panel-header">
            <span id="workspace-title">New Project</span>
            <div style="display:flex; gap: 8px;">
                <button id="btn-download" class="icon-btn" title="Download Code"><i class="fa-solid fa-download"></i></button>
                <button id="btn-copy" class="icon-btn" title="Copy Code"><i class="fa-regular fa-copy"></i></button>
                <button id="btn-preview" class="icon-btn"><i class="fa-solid fa-eye"></i> Preview</button>
            </div>
        </div>
        <div class="editor-workspace">
            <div class="line-numbers" id="line-numbers"><span>1</span></div>
            <div class="code-container">
                <textarea id="code-input" spellcheck="false" wrap="off"></textarea>
                <pre id="code-output-wrapper"><code id="code-output" class="language-html"></code></pre>
            </div>
        </div>

        <div id="preview-overlay" class="preview-overlay-container">
            <div class="preview-header">
                <button id="btn-close-preview" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                <span style="font-weight:600;">Live Preview</span>
                <div></div>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script type='text/javascript'>
        //<![CDATA[
        document.addEventListener('DOMContentLoaded', () => {
            const apiKey = ""; // Set to empty as per environment rules
            let isGenerating = false;
            let currentCode = "";
            let chatHistory = []; 
            let versionHistory = []; 

            const DOM = {
                input: document.getElementById('website-description'),
                btnGenerate: document.getElementById('btn-generate'),
                btnStop: document.getElementById('btn-stop'),
                btnNew: document.getElementById('btn-new'),
                btnText: document.getElementById('btn-text'),
                historyList: document.getElementById('history-list'),
                codeInput: document.getElementById('code-input'),
                codeOutput: document.getElementById('code-output'),
                lineNumbers: document.getElementById('line-numbers'),
                previewOverlay: document.getElementById('preview-overlay'),
                previewFrame: document.getElementById('preview-frame'),
                btnClosePreview: document.getElementById('btn-close-preview'),
                btnPreview: document.getElementById('btn-preview'),
                workspaceTitle: document.getElementById('workspace-title'),
                statusDot: document.getElementById('status-dot'),
                btnCopy: document.getElementById('btn-copy'),
                btnDownload: document.getElementById('btn-download')
            };

            function showToast(msg) {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const t = document.createElement('div');
                t.className = 'toast';
                t.innerText = msg;
                container.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            function updateEditorUI(code) {
                if (!DOM.codeInput || !DOM.codeOutput) return;
                DOM.codeInput.value = code || "";
                DOM.codeOutput.textContent = code || "";
                const lines = (code || "").split('\n').length || 1;
                if (DOM.lineNumbers) {
                    DOM.lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => `<span>${i+1}</span>`).join('');
                }
                Prism.highlightElement(DOM.codeOutput);
            }

            function renderHistory() {
                if (!DOM.historyList) return;
                DOM.historyList.innerHTML = versionHistory.map((item, index) => `
                    <div class="history-item ${index === 0 ? 'active' : ''}" data-index="${index}">
                        <strong>${item.timestamp}</strong>: ${item.prompt.substring(0, 30)}...
                    </div>
                `).join('');

                document.querySelectorAll('.history-item').forEach(el => {
                    el.onclick = () => {
                        const idx = parseInt(el.getAttribute('data-index'));
                        loadVersion(idx);
                    };
                });
            }

            function loadVersion(index) {
                const item = versionHistory[index];
                if (!item) return;
                currentCode = item.code;
                updateEditorUI(currentCode);
                document.querySelectorAll('.history-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });
            }

            async function streamEffect(text) {
                isGenerating = true;
                DOM.btnGenerate.style.display = "none";
                DOM.btnStop.style.display = "flex";
                DOM.statusDot.style.background = "var(--warning)";
                
                let displayed = "";
                const chunks = text.split(" ");
                for (let i = 0; i < chunks.length; i++) {
                    if (!isGenerating) break;
                    displayed += chunks[i] + " ";
                    updateEditorUI(displayed);
                    if (i % 10 === 0) DOM.codeInput.scrollTop = DOM.codeInput.scrollHeight;
                    await new Promise(r => setTimeout(r, 5));
                }
                
                currentCode = displayed;
                isGenerating = false;
                DOM.btnGenerate.style.display = "flex";
                DOM.btnStop.style.display = "none";
                DOM.statusDot.style.background = "var(--success)";
                DOM.btnText.innerText = "Apply Changes";
                DOM.workspaceTitle.innerText = "Project Active";
            }

            async function handleGenerate() {
                const prompt = DOM.input.value.trim();
                if (!prompt) return showToast("Please enter a prompt");

                const userMessage = currentCode 
                    ? `Current Code:\n${currentCode}\n\nTask: ${prompt}. Provide the FULL updated code.`
                    : prompt;

                chatHistory.push({ role: "user", parts: [{ text: userMessage }] });

                try {
                    DOM.btnText.innerText = "Processing...";
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: chatHistory,
                            systemInstruction: { parts: [{ text: "You are an expert web coder. Return ONLY the raw HTML code for a single-file website. No markdown. No explanations. Ensure Blogger compatibility (self-closing meta/link tags, CDATA for scripts/styles)." }] }
                        })
                    });

                    const data = await response.json();
                    let resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    
                    resultText = resultText.replace(/^```html\n?/, "").replace(/\n?```$/, "");
                    
                    if (resultText) {
                        await streamEffect(resultText);
                        versionHistory.unshift({ prompt, code: resultText, timestamp: new Date().toLocaleTimeString() });
                        renderHistory();
                        chatHistory.push({ role: "model", parts: [{ text: resultText }] });
                        DOM.input.value = "";
                    }
                } catch (e) {
                    showToast("Error communicating with AI");
                }
            }

            if (DOM.btnNew) {
                DOM.btnNew.addEventListener('click', () => {
                    currentCode = "";
                    chatHistory = [];
                    versionHistory = [];
                    DOM.historyList.innerHTML = "";
                    DOM.input.value = "";
                    DOM.btnText.innerText = "Build Site";
                    DOM.workspaceTitle.innerText = "New Project";
                    updateEditorUI("");
                    showToast("Project Reset");
                });
            }

            if (DOM.btnGenerate) DOM.btnGenerate.addEventListener('click', handleGenerate);
            if (DOM.btnStop) DOM.btnStop.addEventListener('click', () => { isGenerating = false; });
            if (DOM.btnPreview) {
                DOM.btnPreview.addEventListener('click', () => {
                    DOM.previewFrame.srcdoc = currentCode;
                    DOM.previewOverlay.classList.add('visible');
                });
            }
            if (DOM.btnClosePreview) DOM.btnClosePreview.addEventListener('click', () => DOM.previewOverlay.classList.remove('visible'));
            
            if (DOM.btnCopy) {
                DOM.btnCopy.addEventListener('click', () => {
                    navigator.clipboard.writeText(currentCode);
                    showToast("Code copied");
                });
            }

            if (DOM.btnDownload) {
                DOM.btnDownload.addEventListener('click', () => {
                    const blob = new Blob([currentCode], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'index.html';
                    a.click();
                    URL.revokeObjectURL(url);
                });
            }

            if (DOM.codeInput) {
                DOM.codeInput.addEventListener('scroll', () => {
                    DOM.codeOutput.parentElement.scrollTop = DOM.codeInput.scrollTop;
                    DOM.codeOutput.parentElement.scrollLeft = DOM.codeInput.scrollLeft;
                    DOM.lineNumbers.scrollTop = DOM.codeInput.scrollTop;
                });

                DOM.codeInput.addEventListener('input', (e) => {
                    currentCode = e.target.value;
                    updateEditorUI(currentCode);
                });
            }
        });
        //]]>
    </script>
</body>
</html>
